app:
  id: ari:cloud:ecosystem::app/252214cd-6790-4c66-bf0a-5d07a5b779af
  runtime:
    name: nodejs24.x
environment:
  variables:
    - REMOTE_BASE_URL
modules:
  # See: https://developer.atlassian.com/platform/forge/manifest-reference/modules/rovo-agent-connector
  rovo:agentConnector:
    - key: minimal-connector
      name: Agent Simulator
      icon: resource:agent-resources;icons/agent-robot.svg
      description: Simulates a completed task to verify the A2A connection.
      productContexts:
        - jira
      protocols:
        agent2Agent:
          version: "1.0"
          jsonRpcTransport:
            endpoint: a2a-json-rpc
            streaming: true
  # See: https://developer.atlassian.com/platform/forge/manifest-reference/endpoint
  endpoint:
    - key: a2a-json-rpc
      remote: minimal-agent-remote
      route:
        path: /a2a/json-rpc
      # Jira forwards the invoking user's token in `x-forge-oauth-user` on message
      # and task requests, so the remote can call the Jira REST API as that user.
      auth:
        appSystemToken:
          enabled: true
        appUserToken:
          enabled: true
# See: https://developer.atlassian.com/platform/forge/manifest-reference/remotes
remotes:
  - key: minimal-agent-remote
    baseUrl: ${REMOTE_BASE_URL}
permissions:
  scopes:
    # Lets the remote read Jira work items (the `read` step of the
    # jira-callback scenario calls GET /rest/api/3/issue/{key}).
    - read:jira-work
    # Needed for the `x-forge-oauth-user` and `x-forge-oauth-system` headers
    # (see `auth` on the endpoint and the remote): the user token and the
    # app's own token.
    - read:app-user-token
    - read:app-system-token
resources:
  - key: agent-resources
    path: resources
