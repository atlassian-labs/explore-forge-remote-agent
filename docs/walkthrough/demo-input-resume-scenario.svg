<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 924" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Walkthrough: the input-resume scenario</title>
  <desc id="desc">A user assigns a work item titled Target environment. Jira sends SendStreamingMessage to the remote service, which matches the input-resume scenario and answers with a task in the input-required state, asking the user to confirm the target environment. The task pauses while Jira may poll it with GetTask. When the user replies, Jira sends a second SendStreamingMessage carrying the same task and context IDs. The remote service then streams a working update and a final completed update, and the stream closes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#42526E"/>
    </marker>
  </defs>

  <rect width="960" height="924" fill="#FFFFFF"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#172B4D">Walkthrough: the input-resume scenario</text>
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#42526E">The agent asks the user a question, pauses, and carries on when they answer.</text>

  <!-- Waiting band -->
  <rect x="10" y="352" width="940" height="138" rx="10" fill="#FFFAE6" stroke="#FF991F" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="24" y="374" font-size="11" font-weight="700" fill="#974F0C">WAITING FOR THE USER</text>

  <!-- Participants -->
  <rect x="70" y="84" width="160" height="40" rx="10" fill="#DEEBFF" stroke="#0052CC" stroke-width="2"/>
  <text x="150" y="109" text-anchor="middle" font-size="15" font-weight="700" fill="#172B4D">Jira</text>
  <rect x="350" y="84" width="200" height="40" rx="10" fill="#E3FCEF" stroke="#006644" stroke-width="2"/>
  <text x="450" y="109" text-anchor="middle" font-size="15" font-weight="700" fill="#172B4D">Remote service</text>
  <line x1="150" y1="124" x2="150" y2="740" stroke="#C1C7D0" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="450" y1="124" x2="450" y2="740" stroke="#C1C7D0" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- 1 assignment -->
  <line x1="152" y1="170" x2="448" y2="170" stroke="#42526E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#172B4D">SendStreamingMessage</text>
  <text x="300" y="188" text-anchor="middle" font-size="11" fill="#42526E">Work item "Target environment" assigned</text>
  <text x="490" y="174" font-size="11" fill="#42526E">taskId and contextId are empty: this is a new task.</text>

  <!-- 2 scenario match -->
  <text x="490" y="226" font-size="12" font-weight="700" fill="#172B4D">Scenario chosen: input-resume</text>
  <text x="490" y="243" font-size="11" fill="#42526E">The task text contains the phrase "target environment"</text>
  <text x="490" y="258" font-size="11" fill="#42526E">(match.contains), so the default scenario is not used.</text>

  <!-- 3 input required -->
  <line x1="448" y1="310" x2="152" y2="310" stroke="#42526E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="302" text-anchor="middle" font-size="12" font-weight="700" fill="#172B4D">task: INPUT_REQUIRED</text>
  <text x="300" y="328" text-anchor="middle" font-size="11" fill="#42526E">waitForUserInput: true</text>
  <text x="490" y="306" font-size="11" fill="#42526E">"Input required: please confirm the target</text>
  <text x="490" y="321" font-size="11" fill="#42526E">environment before I begin work."</text>

  <!-- waiting -->
  <text x="300" y="400" text-anchor="middle" font-size="12" font-weight="700" fill="#974F0C">The task is paused</text>
  <text x="300" y="418" text-anchor="middle" font-size="11" fill="#42526E">The agent sends nothing until the user replies.</text>
  <line x1="152" y1="446" x2="448" y2="446" stroke="#42526E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="440" text-anchor="middle" font-size="12" font-weight="700" fill="#172B4D">GetTask</text>
  <line x1="448" y1="474" x2="152" y2="474" stroke="#42526E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="300" y="468" text-anchor="middle" font-size="12" font-weight="700" fill="#172B4D">state: INPUT_REQUIRED</text>
  <text x="490" y="454" font-size="11" fill="#42526E">Jira can check the task while it waits.</text>
  <text x="490" y="469" font-size="11" fill="#42526E">It is still waiting for input.</text>

  <!-- user reply -->
  <rect x="40" y="518" width="220" height="28" rx="14" fill="#DEEBFF" stroke="#0052CC"/>
  <text x="150" y="537" text-anchor="middle" font-size="12" font-weight="700" fill="#172B4D">User replies: "Env 1"</text>

  <!-- 4 resume -->
  <line x1="152" y1="590" x2="448" y2="590" stroke="#42526E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="582" text-anchor="middle" font-size="12" font-weight="700" fill="#172B4D">SendStreamingMessage</text>
  <text x="300" y="608" text-anchor="middle" font-size="11" fill="#42526E">text: "Env 1"</text>
  <text x="490" y="586" font-size="11" font-weight="700" fill="#172B4D">Same taskId and contextId as before,</text>
  <text x="490" y="601" font-size="11" fill="#42526E">so the existing task resumes and keeps its scenario.</text>

  <!-- 5 working -->
  <line x1="448" y1="652" x2="152" y2="652" stroke="#42526E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="644" text-anchor="middle" font-size="12" font-weight="700" fill="#172B4D">statusUpdate: WORKING</text>
  <text x="490" y="656" font-size="11" fill="#42526E">"Thanks, starting work with the confirmed target environment."</text>

  <!-- 6 completed -->
  <line x1="448" y1="702" x2="152" y2="702" stroke="#42526E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="694" text-anchor="middle" font-size="12" font-weight="700" fill="#172B4D">statusUpdate: COMPLETED</text>
  <text x="300" y="720" text-anchor="middle" font-size="11" fill="#42526E">final: true</text>
  <text x="490" y="706" font-size="11" fill="#42526E">"Completed the requested work for the confirmed target environment."</text>

  <rect x="90" y="738" width="420" height="26" rx="13" fill="#FFEBE6" stroke="#DE350B"/>
  <text x="300" y="755" text-anchor="middle" font-size="12" font-weight="700" fill="#172B4D">Terminal state reached: the stream closes</text>
</svg>
