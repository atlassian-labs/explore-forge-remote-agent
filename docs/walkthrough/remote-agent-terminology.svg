<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Remote agents in Jira</title>
  <desc id="desc">Jira tenants and the Forge app run on Atlassian's cloud. The Forge app forwards requests to your remote service, which passes messages to your remote agent. All three of your components are built and maintained by you. The remote service also calls the Jira REST API.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#42526E"/>
    </marker>
  </defs>

  <rect width="960" height="720" fill="#FFFFFF"/>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#172B4D">Remote agents in Jira</text>

  <!-- Atlassian zone -->
  <rect x="30" y="64" width="400" height="420" rx="14" fill="#DEEBFF" stroke="#0052CC" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="50" y="94" font-size="15" font-weight="700" fill="#0747A6">ATLASSIAN CLOUD</text>
  <text x="50" y="113" font-size="12" fill="#0747A6">Hosted on Atlassian infrastructure</text>

  <!-- Your zone -->
  <rect x="530" y="64" width="400" height="420" rx="14" fill="#E3FCEF" stroke="#006644" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="550" y="94" font-size="15" font-weight="700" fill="#006644">YOUR INFRASTRUCTURE</text>
  <text x="550" y="113" font-size="12" fill="#006644">Hosted by you (multi-tenant SaaS)</text>

  <!-- Jira tenants (stacked) -->
  <rect x="64" y="146" width="300" height="104" rx="10" fill="#FFFFFF" stroke="#0052CC" stroke-width="1.5" opacity="0.5"/>
  <rect x="56" y="138" width="300" height="104" rx="10" fill="#FFFFFF" stroke="#0052CC" stroke-width="1.5" opacity="0.75"/>
  <rect x="48" y="130" width="300" height="104" rx="10" fill="#FFFFFF" stroke="#0052CC" stroke-width="2"/>
  <text x="198" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#172B4D">Jira tenant / site</text>
  <text x="198" y="182" text-anchor="middle" font-size="12" fill="#42526E">One per customer, e.g.</text>
  <text x="198" y="200" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#42526E">customer-subdomain.atlassian.net</text>
  <text x="198" y="222" text-anchor="middle" font-size="11" fill="#6B778C">Your agent must serve many tenants</text>

  <!-- Forge app -->
  <rect x="48" y="320" width="300" height="130" rx="10" fill="#FFFFFF" stroke="#0052CC" stroke-width="2"/>
  <text x="198" y="350" text-anchor="middle" font-size="16" font-weight="700" fill="#172B4D">Forge app</text>
  <text x="198" y="372" text-anchor="middle" font-size="12" fill="#42526E">Middleware you build and maintain,</text>
  <text x="198" y="389" text-anchor="middle" font-size="12" fill="#42526E">deployed to Atlassian's platform</text>
  <text x="198" y="412" text-anchor="middle" font-size="11" fill="#6B778C">Registers the agent, makes it installable</text>
  <text x="198" y="428" text-anchor="middle" font-size="11" fill="#6B778C">in Jira, optionally on the Marketplace</text>

  <!-- Remote service -->
  <rect x="582" y="146" width="300" height="130" rx="10" fill="#FFFFFF" stroke="#006644" stroke-width="2"/>
  <text x="732" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#172B4D">Remote service</text>
  <text x="732" y="198" text-anchor="middle" font-size="12" fill="#42526E">Your web application</text>
  <text x="732" y="222" text-anchor="middle" font-size="11" fill="#6B778C">Sends and receives requests to and from</text>
  <text x="732" y="238" text-anchor="middle" font-size="11" fill="#6B778C">Jira Cloud, and passes messages</text>
  <text x="732" y="254" text-anchor="middle" font-size="11" fill="#6B778C">to your remote agent</text>

  <!-- Remote agent -->
  <rect x="582" y="340" width="300" height="110" rx="10" fill="#FFFFFF" stroke="#006644" stroke-width="2"/>
  <text x="732" y="370" text-anchor="middle" font-size="16" font-weight="700" fill="#172B4D">Remote agent</text>
  <text x="732" y="392" text-anchor="middle" font-size="12" fill="#42526E">The AI agent you host and want</text>
  <text x="732" y="409" text-anchor="middle" font-size="12" fill="#42526E">to integrate with Jira</text>
  <text x="732" y="432" text-anchor="middle" font-size="11" fill="#6B778C">Does the actual work</text>

  <!-- Arrows -->
  <!-- Jira -> Forge app -->
  <line x1="198" y1="236" x2="198" y2="318" stroke="#42526E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="210" y="272" font-size="11" fill="#42526E">assign, @mention,</text>
  <text x="210" y="287" font-size="11" fill="#42526E">chat</text>

  <!-- Forge app -> Remote service -->
  <path d="M350 360 C 450 360, 450 230, 580 230" fill="none" stroke="#42526E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="440" y="330" text-anchor="middle" font-size="11" fill="#42526E">A2A request</text>
  <text x="440" y="345" text-anchor="middle" font-size="11" fill="#42526E">+ Forge token</text>

  <!-- Remote service -> Jira REST (dashed) -->
  <path d="M580 175 C 480 175, 450 175, 350 175" fill="none" stroke="#42526E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="465" y="164" text-anchor="middle" font-size="11" fill="#42526E">Jira REST API</text>

  <!-- Remote service <-> agent -->
  <line x1="732" y1="278" x2="732" y2="338" stroke="#42526E" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="746" y="312" font-size="11" fill="#42526E">messages and results</text>

  <!-- Legend -->
  <rect x="30" y="504" width="14" height="14" rx="3" fill="#DEEBFF" stroke="#0052CC"/>
  <text x="52" y="516" font-size="12" fill="#42526E">Runs on Atlassian</text>
  <rect x="170" y="504" width="14" height="14" rx="3" fill="#E3FCEF" stroke="#006644"/>
  <text x="192" y="516" font-size="12" fill="#42526E">Runs on your infrastructure</text>
  <line x1="372" y1="511" x2="402" y2="511" stroke="#42526E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="516" font-size="12" fill="#42526E">Request</text>
  <line x1="480" y1="511" x2="510" y2="511" stroke="#42526E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="518" y="516" font-size="12" fill="#42526E">API call back to Jira</text>
  <text x="930" y="536" text-anchor="end" font-size="11" fill="#6B778C">Forge app and remote parts are built and maintained by you</text>
</svg>
