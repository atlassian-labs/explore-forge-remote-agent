<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Handling Jira tasks: the task lifecycle</title>
  <desc id="desc">A task starts as submitted, then works. It can pause for user input or authentication and resume. It ends in one of four terminal states: completed, failed, canceled or rejected. A terminal task cannot restart, so a retry uses the same context with a new task.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#42526E"/>
    </marker>
  </defs>

  <rect width="960" height="720" fill="#FFFFFF"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#172B4D">Handling Jira tasks: the task lifecycle</text>
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#42526E">One active task per context. A context is private to one user and one agent.</text>

  <!-- Group headings -->
  <text x="175" y="88" font-size="12" font-weight="700" fill="#BF6A00">INTERRUPTED (waiting on the user)</text>
  <text x="640" y="88" font-size="12" font-weight="700" fill="#42526E">TERMINAL (cannot restart)</text>
  <text x="50" y="222" font-size="12" font-weight="700" fill="#0747A6">ACTIVE</text>

  <!-- Start -->
  <circle cx="30" cy="260" r="6" fill="#172B4D"/>
  <line x1="36" y1="260" x2="48" y2="260" stroke="#42526E" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Active -->
  <rect x="50" y="230" width="150" height="60" rx="10" fill="#DEEBFF" stroke="#0052CC" stroke-width="2"/>
  <text x="125" y="256" text-anchor="middle" font-size="13" font-weight="700" fill="#172B4D">SUBMITTED</text>
  <text x="125" y="274" text-anchor="middle" font-size="11" fill="#42526E">Awaiting execution</text>

  <rect x="290" y="230" width="150" height="60" rx="10" fill="#DEEBFF" stroke="#0052CC" stroke-width="2"/>
  <text x="365" y="256" text-anchor="middle" font-size="13" font-weight="700" fill="#172B4D">WORKING</text>
  <text x="365" y="274" text-anchor="middle" font-size="11" fill="#42526E">Agent is working</text>

  <line x1="200" y1="260" x2="288" y2="260" stroke="#42526E" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Interrupted -->
  <rect x="175" y="100" width="190" height="64" rx="10" fill="#FFFAE6" stroke="#FF991F" stroke-width="2"/>
  <text x="270" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#172B4D">INPUT_REQUIRED</text>
  <text x="270" y="144" text-anchor="middle" font-size="11" fill="#42526E">Asks the user for more</text>
  <text x="270" y="157" text-anchor="middle" font-size="11" fill="#42526E">context in chat</text>

  <rect x="385" y="100" width="190" height="64" rx="10" fill="#FFFAE6" stroke="#FF991F" stroke-width="2"/>
  <text x="480" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#172B4D">AUTH_REQUIRED</text>
  <text x="480" y="144" text-anchor="middle" font-size="11" fill="#42526E">User must authenticate</text>
  <text x="480" y="157" text-anchor="middle" font-size="11" fill="#42526E">with a service</text>

  <line x1="335" y1="230" x2="285" y2="166" stroke="#42526E" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="395" y1="230" x2="470" y2="166" stroke="#42526E" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Terminal -->
  <rect x="640" y="100" width="250" height="52" rx="10" fill="#E3FCEF" stroke="#006644" stroke-width="2"/>
  <text x="765" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#172B4D">COMPLETED</text>
  <text x="765" y="141" text-anchor="middle" font-size="11" fill="#42526E">Done; user can draft a comment</text>

  <rect x="640" y="170" width="250" height="52" rx="10" fill="#FFEBE6" stroke="#BF2600" stroke-width="2"/>
  <text x="765" y="194" text-anchor="middle" font-size="13" font-weight="700" fill="#172B4D">FAILED</text>
  <text x="765" y="211" text-anchor="middle" font-size="11" fill="#42526E">Error during execution</text>

  <rect x="640" y="240" width="250" height="52" rx="10" fill="#F4F5F7" stroke="#6B778C" stroke-width="2"/>
  <text x="765" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="#172B4D">CANCELED</text>
  <text x="765" y="281" text-anchor="middle" font-size="11" fill="#42526E">User cancelled it (CancelTask)</text>

  <rect x="640" y="310" width="250" height="52" rx="10" fill="#F4F5F7" stroke="#6B778C" stroke-width="2"/>
  <text x="765" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#172B4D">REJECTED</text>
  <text x="765" y="351" text-anchor="middle" font-size="11" fill="#42526E">Declined; never started</text>

  <!-- Working -> terminal -->
  <path d="M440 255 C 540 255, 540 126, 638 126" fill="none" stroke="#42526E" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M440 258 C 540 258, 540 196, 638 196" fill="none" stroke="#42526E" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M440 262 C 540 262, 540 266, 638 266" fill="none" stroke="#42526E" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Submitted -> rejected -->
  <path d="M125 292 L125 392 L765 392 L765 364" fill="none" stroke="#42526E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="445" y="384" text-anchor="middle" font-size="11" fill="#42526E">rejected before work starts</text>

  <!-- Notes -->
  <rect x="30" y="430" width="440" height="100" rx="10" fill="#F4F5F7" stroke="#C1C7D0"/>
  <text x="46" y="454" font-size="13" font-weight="700" fill="#172B4D">How Jira follows a task</text>
  <text x="46" y="476" font-size="12" fill="#42526E"><tspan font-weight="700">Polling (default):</tspan> Jira calls GetTask while the task</text>
  <text x="46" y="492" font-size="12" fill="#42526E">is active or interrupted, and stops at a terminal state.</text>
  <text x="46" y="512" font-size="12" fill="#42526E"><tspan font-weight="700">Streaming (opt-in):</tspan> SendStreamingMessage returns SSE events.</text>

  <rect x="490" y="430" width="440" height="100" rx="10" fill="#F4F5F7" stroke="#C1C7D0"/>
  <text x="506" y="454" font-size="13" font-weight="700" fill="#172B4D">Retrying a failed, canceled or rejected task</text>
  <text x="506" y="476" font-size="12" fill="#42526E">Jira sends a new message with the same contextId.</text>
  <text x="506" y="492" font-size="12" fill="#42526E">The agent returns a NEW task with a new task ID.</text>
  <text x="506" y="512" font-size="12" fill="#42526E">The old task is never reused.</text>
</svg>
